name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            targets: node20-linux-x64
          - name: macos
            os: macos-latest
            targets: node20-macos-x64,node20-macos-arm64
          - name: win-x64
            os: windows-latest
            targets: node20-win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build binaries
        run: npm run build:binary
        env:
          PKG_TARGETS: ${{ matrix.targets }}
      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: |
          for bin in release/youngflow-macos-*; do
            codesign --sign - "$bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: youngflow-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
